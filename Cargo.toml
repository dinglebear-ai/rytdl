[workspace]
members = ["."]
resolver = "2"

[workspace.package]
version = "1.0.3"
edition = "2024"
rust-version = "1.97.1"
authors = ["dinglebear.ai <hello@dinglebear.ai>"]
license = "MIT"
readme = "README.md"
homepage = "https://rytdl.dinglebear.ai"
repository = "https://github.com/dinglebear-ai/rytdl"
description = "MCP server and CLI for yt-dlp: search and download media, embed metadata and cover art, then deliver to local, SSH, or rclone targets and Plex."

[workspace.dependencies]
rmcp = { version = "=3.0.0-beta.3", default-features = false }
schemars = "=1.2.2"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing_safety_doc = "deny"
mod_module_files = "deny"

[workspace.lints.rust]
missing_crate_level_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
private_intra_doc_links = "warn"
bare_urls = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"
invalid_html_tags = "deny"

[package]
name = "ytdl-rmcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
categories = ["command-line-utilities", "multimedia", "multimedia::video", "multimedia::audio", "api-bindings"]
keywords = ["mcp", "yt-dlp", "youtube", "media", "plex"]
description.workspace = true
default-run = "rytdl"
build = "build.rs"

[[bin]]
name = "rytdl"
path = "src/main.rs"

[dependencies]
# MCP server (stdio transport)
rmcp = { workspace = true, features = [
  "server",
  "macros",
  "transport-io",
  "schemars",
] }

# Async runtime — trimmed feature set (no `full`)
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "io-std",
  "io-util",
  "process",
  "fs",
  "time",
  "sync",
] }

# Serialization / schemas
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars.workspace = true

# CLI dispatch (serve | setup)
clap = { version = "4", features = ["derive"] }

# Errors + logging (logging MUST go to stderr — stdout is the JSON-RPC channel)
anyhow = "1"
shell-words = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Locate external executables (yt-dlp, ffmpeg, rsync, scp, ssh)
which = "8"

# URL parsing for mix/radio cleaning
url = "2"

# Staging dirs + per-user cache/state dirs
tempfile = "3"
directories = "6"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
ffmpeg-sidecar = "2.5.2"
fs2 = "0.4.3"
dialoguer = { version = "0.12.0", default-features = false }
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
lofty = "0.24.0"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[profile.release]
strip = true
lto = "thin"
